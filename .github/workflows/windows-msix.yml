name: Windows MSIX

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  build-msix:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Test shared application logic
        shell: pwsh
        run: |
          npm --prefix server ci
          npm --prefix server run typecheck
          npm --prefix server run test:agent
      - name: Create test certificate and build signed test MSIX
        shell: pwsh
        run: |
          $password = [Guid]::NewGuid().ToString("N")
          ./packaging/windows/new-test-certificate.ps1 -Password $password
          ./packaging/windows/build-msix.ps1 -Version 1.0.${{ github.run_number }}.0 -CertificatePath ./packaging/windows/output/iPhone-Data-Sharing-Test.pfx -CertificatePassword $password
      - name: Remove private test key
        if: always()
        shell: pwsh
        run: Remove-Item ./packaging/windows/output/*.pfx -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: iPhone-Data-Sharing-MSIX
          path: |
            packaging/windows/output/*.msix
            packaging/windows/output/*.cer
          if-no-files-found: error
