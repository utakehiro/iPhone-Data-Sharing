<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>iPhone Share</title>
    <link rel="stylesheet" href="popup.css">
    <script src="popup.js" defer></script>
  </head>
  <body>
    <main>
      <header>
        <div class="logo">⇧</div>
        <div><p>iPhone Share</p><small>Mac / Windows receiver</small></div>
      </header>

      <section class="device-card">
        <div class="name-row">
          <input id="device-name" aria-label="Device Name" maxlength="80" value="My Windows PC">
          <button id="save-name" title="端末名を保存">保存</button>
        </div>
        <div id="status" class="status disconnected"><span></span><b>Disconnected</b></div>
        <p id="status-copy">サーバーへの接続を確認しています…</p>
      </section>

      <button id="show-qr" class="primary">QRコードを表示</button>
      <section id="qr-panel" class="qr-panel hidden">
        <img id="qr-image" alt="iPhoneセットアップ用QRコード">
        <p>iPhoneのカメラで読み取ってください</p>
      </section>

      <details>
        <summary>接続設定</summary>
        <label for="server-url">Server URL</label>
        <div class="name-row">
          <input id="server-url" inputmode="url" value="http://localhost:3000">
          <button id="save-server">接続</button>
        </div>
        <p class="help">通常はlocalhostのままで使用します。</p>
      </details>

      <div class="meta">
        <span>Device ID</span>
        <button id="copy-id" title="Device IDをコピー"><code id="device-id">読み込み中…</code></button>
      </div>
      <p id="message" role="status"></p>
    </main>
  </body>
</html>
